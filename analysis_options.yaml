include: package:lints/recommended.yaml

analyzer:
  # Copies of the example Flutter app used by the evaluation. They are not
  # code of this package, and they need Flutter to be analyzed.
  exclude:
    - eval/files/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_catches_without_on_clauses
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - unawaited_futures
